name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
      - id: filter
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            {
              echo "frontend=true"
              echo "backend=true"
              echo "docker=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA...HEAD" > /tmp/camera-recorder-changed-files
          echo "Changed files:"
          cat /tmp/camera-recorder-changed-files

          python - <<'PY'
          import os
          from pathlib import Path

          changed = [
              line.strip()
              for line in Path('/tmp/camera-recorder-changed-files').read_text().splitlines()
              if line.strip()
          ]

          workflow = '.github/workflows/ci.yml'

          def any_path(predicate):
              return any(predicate(path) for path in changed)

          frontend = workflow in changed or any_path(lambda path: path.startswith('frontend/'))
          backend = workflow in changed or any_path(
              lambda path: path.startswith('backend/') or path.startswith('hik_bridge/')
          )
          docker = workflow in changed or any_path(
              lambda path: (
                  path.startswith('backend/')
                  or path.startswith('hik_bridge/')
                  or path.startswith('vendor/ffmpeg/')
                  or path.startswith('scripts/')
                  or path in {
                      'frontend/Dockerfile',
                      'frontend/nginx.conf',
                      'backend/Dockerfile',
                      'docker-compose.yml',
                      'deploy.sh',
                      '.dockerignore',
                      '.env.example',
                  }
              )
          )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"frontend={'true' if frontend else 'false'}\n")
              output.write(f"backend={'true' if backend else 'false'}\n")
              output.write(f"docker={'true' if docker else 'false'}\n")
          PY

  backend-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --dev
      - run: uv run python -m compileall app
      - run: uv run ruff check app tests migrations ci_test_shards.py
      - name: Compile HIK bridge
        run: cd .. && backend/.venv/bin/python -m compileall hik_bridge
      - name: Test HIK bridge
        run: cd .. && backend/.venv/bin/python -m pytest hik_bridge/tests

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --dev
      - name: Run backend pytest shard ${{ matrix.shard }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          uv run python ci_test_shards.py --shards 4 --index "$SHARD_INDEX" > /tmp/backend-test-files
          mapfile -t test_files < /tmp/backend-test-files
          printf 'Shard %s runs %s test files:\n' "$SHARD_INDEX" "${#test_files[@]}"
          printf '  %s\n' "${test_files[@]}"
          uv run python -m pytest "${test_files[@]}"

  backend:
    needs: [changes, backend-quality, backend-tests]
    if: always() && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend jobs
        env:
          QUALITY_RESULT: ${{ needs.backend-quality.result }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: frontend-npm-${{ runner.os }}-node22-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            frontend-npm-${{ runner.os }}-node22-
      - run: npm install --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment scripts
        run: |
          bash -n deploy.sh
          bash -n scripts/download-ffmpeg.sh
          bash -n scripts/stability-check.sh
      - name: Cache FFmpeg archive
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg/ffmpeg-linux64.tar.xz
          key: camera-recorder-ffmpeg-linux64-v1
      - name: Prepare FFmpeg archive
        env:
          GITHUB_PROXY_PROMPT: "0"
        run: bash scripts/download-ffmpeg.sh amd64
      - name: Validate core, discovery and HIK profile Compose models
        run: |
          docker compose config
          docker compose --profile discovery config
          docker compose --profile hik config
          docker compose config --services | tee /tmp/core-services
          if grep -Eq '^(hik-bridge|onvif-discovery)
      - run: docker compose build backend frontend
      - run: docker compose up -d backend frontend
      - name: Verify optional services are not started by core deployment
        run: |
          for name in camera-recorder-hik-bridge camera-recorder-onvif-discovery; do
            if docker ps -a --format '{{.Names}}' | grep -qx "$name"; then
              echo "$name must not be created by default core startup" >&2
              docker ps -a
              exit 1
            fi
          done
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' camera-recorder-backend 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Verify discovery helper topology
        run: |
          docker compose --profile discovery up -d --no-deps onvif-discovery
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' camera-recorder-onvif-discovery 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$i" = "30" ]; then
              docker compose --profile discovery logs onvif-discovery
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          import subprocess

          container = json.loads(
              subprocess.check_output(
                  ['docker', 'inspect', 'camera-recorder-onvif-discovery'],
                  text=True,
              )
          )[0]
          assert container['HostConfig']['NetworkMode'] == 'host', container['HostConfig']['NetworkMode']
          assert not (container['HostConfig'].get('PortBindings') or {}), container['HostConfig'].get('PortBindings')
          PY
          docker compose exec -T backend python - <<'PY'
          import socket

          path = '/run/camera-recorder/onvif-discovery.sock'
          client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          client.settimeout(3)
          client.connect(path)
          client.close()
          print('backend can reach discovery helper through Unix Socket')
          PY
      - name: Verify database migration compatibility
        run: |
          docker compose exec -T backend alembic current | tee /tmp/alembic-current
          grep -q '(head)' /tmp/alembic-current
          docker compose exec -T backend python - <<'PY'
          import asyncio
          from sqlalchemy import inspect
          from app.core.database import engine

          async def main():
              async with engine.connect() as connection:
                  tables = await connection.run_sync(
                      lambda sync_connection: set(inspect(sync_connection).get_table_names())
                  )
                  required = {
                      'cameras',
                      'camera_connections',
                      'rtsp_connection_configs',
                      'motion_detection_settings',
                      'motion_zones',
                      'motion_events',
                      'onvif_device_metadata',
                      'hik_device_metadata',
                  }
                  missing = required - tables
                  if missing:
                      raise SystemExit(f'missing tables after migration: {sorted(missing)}')
                  columns = await connection.run_sync(
                      lambda sync_connection: inspect(sync_connection).get_columns('cameras')
                  )
                  connection_type = next(
                      (column for column in columns if column['name'] == 'connection_type'),
                      None,
                  )
                  if connection_type is None:
                      raise SystemExit('cameras.connection_type is missing')
                  if 'manual_rtsp' not in str(connection_type.get('default') or ''):
                      raise SystemExit(
                          f"unexpected connection_type default: {connection_type.get('default')}"
                      )

          asyncio.run(main())
          PY
      - name: Verify backend is internal only and HIK capability is disabled
        run: |
          python - <<'PY'
          import json
          import subprocess

          container = json.loads(
              subprocess.check_output(
                  ['docker', 'inspect', 'camera-recorder-backend'],
                  text=True,
              )
          )[0]
          bindings = container.get('HostConfig', {}).get('PortBindings') or {}
          published = bindings.get('8000/tcp') or []
          if published:
              raise SystemExit(f"camera-recorder-backend 8000/tcp must not be published: {published}")
          print('backend:8000 is internal-only')
          PY
          docker compose exec -T backend python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5) as response:
              assert response.status == 200
          with urllib.request.urlopen("http://127.0.0.1:8000/api/camera-adapters", timeout=5) as response:
              payload = json.load(response)
          hik = next(item for item in payload if item.get('id') == 'hik_sdk')
          assert hik.get('available') is False, hik
          assert hik.get('unavailable_reason') == 'HIK SDK adapter is disabled by deployment configuration', hik
          PY
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs frontend
          exit 1
      - name: Verify runtime timezone and frontend routes
        run: |
          curl -fsS http://127.0.0.1:8080/api/settings/runtime > /tmp/runtime-settings.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/runtime-settings.json').read_text())
          assert payload.get('timezone') == 'Asia/Shanghai', payload
          PY
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8080/cameras >/dev/null
          curl -fsS http://127.0.0.1:8080/events >/dev/null
          curl -fsS 'http://127.0.0.1:8080/settings?section=operations' >/dev/null
          curl -fsS http://127.0.0.1:8080/uploads >/dev/null
      - name: Verify event detection deep link
        run: curl -fsS http://127.0.0.1:8080/event-detection >/dev/null
      - name: Verify frontend proxies backend health
        run: curl -fsS http://127.0.0.1:8080/health >/dev/null
      - name: Verify upload websocket proxy
        run: |
          docker compose exec -T backend python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main():
              async with websockets.connect("ws://frontend/ws/uploads", open_timeout=10) as websocket:
                  raw = await asyncio.wait_for(websocket.recv(), timeout=10)
                  payload = json.loads(raw)
                  assert payload["type"] == "uploads.snapshot", payload
                  assert isinstance(payload["tasks"], list), payload
                  assert isinstance(payload["status"].get("counts"), dict), payload

          asyncio.run(main())
          PY
      - name: Show service state
        run: docker compose ps
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker compose --profile discovery down -v --remove-orphans || true
          docker compose --profile hik down -v --remove-orphans || true
 /tmp/core-services; then
            echo 'optional services must not be part of the default core service set' >&2
            exit 1
          fi
          docker compose --profile discovery config --services | grep -qx 'onvif-discovery'
          docker compose --profile hik config --services | grep -qx 'hik-bridge'
      - run: docker compose build backend frontend
      - run: docker compose up -d backend frontend
      - name: Verify HIK bridge is not started by core deployment
        run: |
          if docker ps -a --format '{{.Names}}' | grep -qx 'camera-recorder-hik-bridge'; then
            echo 'camera-recorder-hik-bridge must not be created by default core startup' >&2
            docker ps -a
            exit 1
          fi
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' camera-recorder-backend 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Verify database migration compatibility
        run: |
