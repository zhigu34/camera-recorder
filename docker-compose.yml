name: camera-recorder

services:
  onvif-discovery:
    profiles: ["discovery"]
    image: camera-recorder-core:local
    container_name: camera-recorder-onvif-discovery
    init: true
    restart: unless-stopped
    network_mode: host
    working_dir: /app/backend
    command:
      - sh
      - -c
      - rm -f /run/camera-recorder/onvif-discovery.sock && exec /app/backend/.venv/bin/uvicorn app.discovery_helper:app --uds /run/camera-recorder/onvif-discovery.sock
    volumes:
      - camera-discovery-runtime:/run/camera-recorder
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/run/camera-recorder/onvif-discovery.sock'); s.close()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  hik-bridge:
    profiles: ["hik"]
    image: camera-recorder-core:local
    container_name: camera-recorder-hik-bridge
    init: true
    restart: unless-stopped
    working_dir: /app
    command: ["/app/backend/.venv/bin/uvicorn", "hik_bridge.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HIK_SDK_PATH: /opt/hikvision/runtime
    volumes:
      - ${HIK_SDK_DIR:-./hik-sdk-runtime}:/opt/hikvision/runtime:ro
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    image: camera-recorder-core:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    container_name: camera-recorder-backend
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CAMREC_SECRET_KEY: ${CAMREC_SECRET_KEY:-camera-recorder-local-change-me}
      CAMREC_DATABASE_URL: sqlite+aiosqlite:////app/data/camera.db
      CAMREC_DATA_DIR: /app/data
      CAMREC_RECORDINGS_DIR: /app/recordings
      CAMREC_STAGING_DIR: /app/staging
      CAMREC_FAILED_DIR: /app/failed
      CAMREC_LOGS_DIR: /app/logs
      CAMREC_OPENLIST_PUBLIC_PORT: ${OPENLIST_PORT:-5244}
      CAMREC_HIK_ENABLED: ${CAMREC_HIK_ENABLED:-0}
      CAMREC_HIK_BRIDGE_URL: http://hik-bridge:8100
      CAMREC_INTERNAL_MEDIA_URL: http://127.0.0.1:8000
      CAMREC_ONVIF_DISCOVERY_SOCKET: /run/camera-recorder/onvif-discovery.sock
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./staging:/app/staging
      - ./failed:/app/failed
      - ./logs:/app/logs
      - camera-discovery-runtime:/run/camera-recorder
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: camera-recorder-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CAMREC_WEB_PORT:-8080}:80"

  openlist:
    image: openlistteam/openlist:latest
    container_name: camera-recorder-openlist
    user: "${OPENLIST_UID:-0}:${OPENLIST_GID:-0}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UMASK: "022"
      OPENLIST_ADMIN_PASSWORD: ${OPENLIST_ADMIN_PASSWORD:-camera-recorder-openlist-change-me}
    volumes:
      - ./openlist-data:/opt/openlist/data
    ports:
      - "${OPENLIST_PORT:-5244}:5244"

volumes:
  camera-discovery-runtime:
