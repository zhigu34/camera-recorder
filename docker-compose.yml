name: camera-recorder

services:
  hik-bridge:
    image: camera-recorder-core:local
    container_name: camera-recorder-hik-bridge
    init: true
    restart: unless-stopped
    working_dir: /app
    command: ["/app/backend/.venv/bin/uvicorn", "hik_bridge.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HIK_SDK_PATH: /opt/hikvision/runtime
    volumes:
      - ${HIK_SDK_DIR:-./hik-sdk-runtime}:/opt/hikvision/runtime:ro
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    image: camera-recorder-core:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: camera-recorder-backend
    init: true
    restart: unless-stopped
    depends_on:
      hik-bridge:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CAMREC_SECRET_KEY: ${CAMREC_SECRET_KEY:-camera-recorder-local-change-me}
      CAMREC_DATABASE_URL: sqlite+aiosqlite:////app/data/camera.db
      CAMREC_DATA_DIR: /app/data
      CAMREC_RECORDINGS_DIR: /app/recordings
      CAMREC_STAGING_DIR: /app/staging
      CAMREC_FAILED_DIR: /app/failed
      CAMREC_LOGS_DIR: /app/logs
      CAMREC_OPENLIST_PUBLIC_PORT: ${OPENLIST_PORT:-5244}
      CAMREC_HIK_BRIDGE_URL: http://hik-bridge:8100
      CAMREC_INTERNAL_MEDIA_URL: http://127.0.0.1:8000
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./staging:/app/staging
      - ./failed:/app/failed
      - ./logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: camera-recorder-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CAMREC_WEB_PORT:-8080}:80"

  openlist:
    image: openlistteam/openlist:latest
    container_name: camera-recorder-openlist
    user: "${OPENLIST_UID:-0}:${OPENLIST_GID:-0}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UMASK: "022"
      OPENLIST_ADMIN_PASSWORD: ${OPENLIST_ADMIN_PASSWORD:-camera-recorder-openlist-change-me}
    volumes:
      - ./openlist-data:/opt/openlist/data
    ports:
      - "${OPENLIST_PORT:-5244}:5244"
